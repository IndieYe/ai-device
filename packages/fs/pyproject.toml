[project]
license = "MIT"
license-files = ["LICENSE"]
name = "ai-device-fs"
version = "0.2.0"
description = "MCP filesystem server using FastMCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The Linux native payload targets glibc 2.17 (CentOS 7 baseline), and Pillow
    # stopped publishing manylinux_2_17 cp313 x86_64 wheels after 12.2.0 --
    # 12.3.0 moved to manylinux_2_27. This package reads PNG, JPEG and WEBP
    # through Image.open/size/load/verify only, all long-stable API, so the
    # newer line buys nothing here.
    "pillow>=11.0.0,<=12.2.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.1.0,<4",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-server-fs = "mcp_server_fs.cli:main"

[project.urls]
Homepage = "https://github.com/IndieYe/ai-device"
Repository = "https://github.com/IndieYe/ai-device"
Issues = "https://github.com/IndieYe/ai-device/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server_fs"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
