[project]
license = "MIT"
license-files = ["LICENSE"]
name = "ai-device-bash"
version = "0.2.0"
description = "Reusable local execution core with an optional FastMCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.0.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=3.4.2,<4", "pydantic>=2.12.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-server-bash = "mcp_server_bash.cli:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = [
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_bash"]
